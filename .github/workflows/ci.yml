# Continuous integration: runs on every push and pull request.
# 1. lint   - checks code style with ruff
# 2. test   - runs the tests on three Python versions
# 3. build  - builds the package and runs the demo; keeps the files as artifacts
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Check style
        run: |
          ruff check .
          ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev tools
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=edgeguard --cov-report=term-missing --cov-report=xml
      - name: Keep coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Install the built wheel and run the demo
        run: |
          pip install dist/*.whl
          mkdir -p results
          edgeguard demo | tee results/demo_scores.txt
          edgeguard run examples/sample_stream.csv --column consumption_kw --train 600 --output results/sample_output.csv
      - name: Keep package and results
        uses: actions/upload-artifact@v4
        with:
          name: package-and-results
          path: |
            dist/
            results/
