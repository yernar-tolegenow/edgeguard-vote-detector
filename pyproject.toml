[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeguard-vote-detector"
version = "0.1.0"
description = "A small 2-of-3 anomaly detector and response state machine for smart-city utility IoT data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yernar Tolegenov" }]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
edgeguard = "edgeguard.cli:main"

[project.urls]
Homepage = "https://github.com/yernar-tolegenow/edgeguard-vote-detector"
Issues = "https://github.com/yernar-tolegenow/edgeguard-vote-detector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
